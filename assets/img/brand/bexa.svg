<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Bexa — الأيقونة الكبيرة (64 → 512 بكسل).
    حرف «b» هندسي (عمود + دائرة) بالأبيض، وفي فراغه العلوي ثلاث «بكسلات» صاعدة
    بأخضر Nexa Solutions: نمو المبيعات، وخيط يربط المنتج بهوية الشركة الأم.
    نفس الحرف ونفس البكسلات في شعار الكلمة (resources/brand) — هوية واحدة متسقة.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3D8BFF"/>
      <stop offset="48%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#172B7A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0.12" r="0.8">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="0" y1="90" x2="0" y2="430">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DCE8FF"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#65C21A"/>
      <stop offset="100%" stop-color="#B5F04A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0A1A5C" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- البلاطة -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#glow)"/>
  <rect x="18.5" y="18.5" width="475" height="475" rx="109.5" fill="none" stroke="url(#rim)" stroke-width="5"/>

  <g filter="url(#shadow)" transform="translate(-4 14)">
    <!-- الحرف b: عمود ودائرة بسُمك واحد -->
    <g fill="none" stroke="url(#ink)" stroke-width="62" stroke-linecap="round">
      <line x1="166" y1="118" x2="166" y2="300"/>
      <circle cx="260" cy="300" r="94"/>
    </g>
    <!-- بكسلات النمو: تصعد نحو الركن العلوي -->
    <rect x="232" y="112" width="42" height="42" rx="10" fill="url(#lime)"/>
    <rect x="294" y="76" width="32" height="32" rx="8" fill="url(#lime)"/>
    <rect x="344" y="48" width="22" height="22" rx="6" fill="#FFFFFF" fill-opacity="0.85"/>
  </g>
</svg>
