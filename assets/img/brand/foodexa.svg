<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Foodexa mark: an «F» whose stem is a fork, with a plate for the dot, on the brand-orange tile. -->
  <defs>
    <linearGradient id="fx-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF9F45"/>
      <stop offset="0.5" stop-color="#F97316"/>
      <stop offset="1" stop-color="#C2410C"/>
    </linearGradient>
    <radialGradient id="fx-shine" cx="0.22" cy="0.12" r="0.85">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fx-ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFEBDD"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#fx-tile)"/>
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#fx-shine)"/>
  <rect x="18" y="18" width="476" height="476" rx="118" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="4"/>
  <g fill="url(#fx-ink)">
    <!-- fork tines -->
    <rect x="140" y="100" width="24" height="92" rx="12"/>
    <rect x="180" y="100" width="24" height="92" rx="12"/>
    <rect x="220" y="100" width="24" height="92" rx="12"/>
    <!-- fork head flowing into the stem -->
    <path d="M140 176 h104 v34 c0 22 -12 36 -20 44 v148 a32 32 0 0 1 -64 0 v-148 c-8 -8 -20 -22 -20 -44 z"/>
    <!-- F arms -->
    <path d="M206 214 h150 a34 34 0 0 1 0 68 h-150 z"/>
    <path d="M206 308 h102 a31 31 0 0 1 0 62 h-102 z"/>
  </g>
  <!-- the dot: a plate seen from above, aligned with the top arm -->
  <circle cx="354" cy="142" r="36" fill="none" stroke="#FFFFFF" stroke-width="15"/>
  <circle cx="354" cy="142" r="12" fill="#FFFFFF"/>
</svg>
